<!doctype html><html lang="cs"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Camino al Sur</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#687d48"><link rel="icon" href="icon-192.png"><style>
:root{color-scheme:light;--bg:#f5efe3;--card:#fffaf1;--ink:#26372b;--accent:#687d48;--muted:#706b60}body.dark{color-scheme:dark;--bg:#202820;--card:#303b30;--ink:#f5efe3;--accent:#a4b77c;--muted:#c4c7b9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px system-ui}main{max-width:680px;margin:auto;padding:20px 16px 100px}header{display:flex;justify-content:space-between;align-items:center}h1{font-family:Georgia;font-size:32px;margin:8px 0}small,p{color:var(--muted)}button,input,select{font:inherit;border:1px solid var(--accent);border-radius:12px;padding:12px;background:var(--card);color:var(--ink)}button{cursor:pointer}button.primary,nav button.active{background:var(--accent);color:var(--bg);font-weight:bold}article{background:var(--card);border-radius:20px;padding:22px;margin:14px 0;box-shadow:0 3px 15px #0000000b}.picture{font-size:85px;text-align:center;background:#c4a56b22;border-radius:16px;padding:20px}h2{margin:12px 0 4px}.center{text-align:center}.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);display:flex;justify-content:center;gap:5px;padding:10px}nav button{padding:10px 8px;font-size:14px}.word{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid #8883;padding:12px 0}.options{display:grid;gap:8px;margin:15px 0}.good{color:#438c52}.bad{color:#bd593e}input{width:100%}input[type=checkbox]{width:auto;accent-color:var(--accent)}.example{background:#c4a56b22;border-radius:12px;padding:12px;margin:12px 0}.example p{margin-bottom:0}.filters{margin:10px 0}.word button{padding:8px}.word label{flex:1}button:disabled{opacity:.5}progress{width:100%;accent-color:var(--accent)}
.picture img{display:block;width:100%;max-height:240px;object-fit:contain;border-radius:12px}.picture .photo-fallback[hidden],.picture img[hidden]{display:none}
.word-open{flex:1;text-align:left;border:0;background:transparent;min-width:0}.word-open small{display:block}.word-open:focus-visible{outline:2px solid var(--accent)}dialog{width:min(94vw,600px);max-height:90dvh;overflow:auto;border:1px solid var(--accent);border-radius:20px;background:var(--card);color:var(--ink);padding:18px}dialog::backdrop{background:#0008}dialog article{margin:0;padding:12px;box-shadow:none}body.detail-open{overflow:hidden}.detail-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
</style><body><main><header><div><small>🇪🇸 DIEZ PALABRAS AL DÍA</small><h1>Camino al Sur</h1></div><button id="theme" aria-label="Změnit motiv">☾</button></header><p>Cada palabra, un paso más cerca del sur. <small>· v0.6.1</small></p><p id="updateBanner" hidden>Je dostupná nová verze. <button id="reloadUpdate">Načíst aktualizaci</button></p><section id="view"></section></main><nav id="nav"></nav><dialog id="detail" aria-labelledby="detailTitle"></dialog><script src="words.js"></script><script>
const topics=[...new Set(words.map(w=>w.topic))]; const VERSION="0.6.1";
 const $=id=>document.getElementById(id);function day(){let d=new Date();d.setHours(d.getHours()-5);return Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000}let state;try{state=JSON.parse(localStorage.getItem('camino01'))}catch{}state=state||{start:day(),stats:{},dark:false};function save(){try{localStorage.setItem('camino01',JSON.stringify(state))}catch{ $('notice')?.remove();let p=document.createElement('p');p.id='notice';p.textContent='Ukládání není dostupné. Pokrok může po zavření zmizet.';document.querySelector('main').prepend(p)}}save();let tab='Dnes',idx=0,test=null;function batch(){return Math.max(0,day()-state.start+(state.offset||0))}const doses=[5,10,15,20,30];function dose(){return doses.includes(state.dose)?state.dose:10}function position(){let a=state.schedule;return Math.max(0,a? a.pos+(batch()-a.day)*dose():batch()*10)}function today(){return words.slice(position(),position()+dose())}function archive(){return words.slice(0,Math.min(position(),words.length))}function changeDose(n){if(!doses.includes(n))return;state.schedule={day:batch(),pos:position()};state.dose=n;idx=0;save();render()}function speak(w){stopWalk();if($('walk'))$('walk').textContent="🎧 Režim na procházku";if(!('speechSynthesis'in window)){alert('Prohlížeč nepodporuje výslovnost.');return}let u=new SpeechSynthesisUtterance(w.es);u.lang='es-ES';let v=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase()==='es-es');if(v)u.voice=v;u.rate=Number(state.rate)||.85;u.onerror=e=>{if(['canceled','interrupted'].includes(e.error))return;alert('Výslovnost není dostupná. Zkontroluj španělský hlas v systému.')};speechSynthesis.cancel();speechSynthesis.speak(u)}function theme(){document.body.classList.toggle('dark',state.dark)}theme();$('theme').onclick=()=>{state.dark=!state.dark;theme();save()};function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function go(t){stopWalk();tab=t;test=null;idx=0;selected.clear();filters={q:"",topic:"",kind:"",level:""};render()}function start(pool,mode){stopWalk();if(!pool.length)return;test={pool:shuffle(pool),mode,i:0,score:0,answered:false};render()}function norm(s){return s.trim().toLowerCase().replace(/\s+/g,' ')}function answer(s){if(test.answered)return;let w=test.pool[test.i],expected=['cz','listen'].includes(test.mode)?w.cz:w.es,ok=norm(s)===norm(expected);test.answered=true;test.score+=+ok;let st=state.stats[w.id]||{ok:0,total:0};st.total++;st.ok+=+ok;st.level=ok?Math.min(5,(st.level||0)+1):0;st.due=day()+(state.offset||0)+(ok?[0,1,3,7,14,30][st.level]:0);state.stats[w.id]=st;save();$('feedback').textContent=(ok?'¡Correcto!':'Správně: '+expected);$('feedback').className=ok?'good':'bad';document.querySelectorAll('.options button,.options input').forEach(e=>e.disabled=true);$('next').disabled=false}function next(){test.i++;test.answered=false;render()}function buttons(pool){return `<div class="controls"><button class="primary" data-mode="es">ČJ → ES</button><button data-mode="cz">ES → ČJ</button><button data-mode="write">Psaní</button><button data-mode="listen">Poslech</button></div>`}function bindTests(pool){document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>start(pool,b.dataset.mode))}function wordPicture(w){return w.photo?`<img src="${w.photo}" alt="" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><span class="photo-fallback" hidden>${w.pic}</span>`:w.pic}function render(){let v=$('view');$('nav').innerHTML=['Dnes','Opakování','Slovník','Pokrok'].map(t=>`<button class="${tab===t?'active':''}">${t}</button>`).join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.textContent));if(test){if(test.i>=test.pool.length){v.innerHTML=`<article class="center"><h2>Test dokončen</h2><h1>${test.score} / ${test.pool.length}</h1><button id="again">Znovu</button> <button id="back">Zpět</button></article>`;$('again').onclick=()=>start(test.pool,test.mode);$('back').onclick=()=>{test=null;render()};return}let w=test.pool[test.i],m=test.mode,expected=['cz','listen'].includes(m)?w.cz:w.es;let field=['cz','listen'].includes(m)?'cz':'es';let opts=shuffle([expected,...shuffle([...new Set([...test.pool,...words].map(x=>x[field]).filter(x=>norm(x)!==norm(expected)))]).slice(0,3)]);v.innerHTML=`<article><small>Otázka ${test.i+1} / ${test.pool.length}</small><progress value="${test.i}" max="${test.pool.length}"></progress><div class="picture">${m==='listen'?'🎧':m==='cz'?'🇪🇸':wordPicture(w)}</div><h2 class="center">${m==='listen'?'<button id="hear">🔊 Přehrát slovíčko</button>':m==='cz'?w.es:w.cz}</h2><div class="options">${m==='write'?'<form id="write"><input id="entry" autocomplete="off" placeholder="Napiš výraz včetně členu" required><button>Ověřit</button></form>':opts.map(o=>`<button>${o}</button>`).join('')}</div><p id="feedback" aria-live="polite"></p><button id="next" disabled>Pokračovat</button></article>`;if(m==='write')$('write').onsubmit=e=>{e.preventDefault();answer($('entry').value)};else document.querySelectorAll('.options button').forEach(b=>b.onclick=()=>answer(b.textContent));$('next').onclick=()=>{stopWalk();next()};if(m==='listen'){$('hear').onclick=()=>speak(w);speak(w)}return}if(tab==='Dnes'){let pool=today(),w=pool[idx];if(!w){v.innerHTML='<article>Všechny denní dávky byly odemčeny. Pokračuj v opakování.</article>';return}v.innerHTML=`<small>Den ${batch()+1} · ${idx+1} / ${pool.length}</small><article class="center"><div class="picture">${wordPicture(w)}</div><h2>${w.es}</h2><div>${w.cz}</div>${w.phon?`<p>[${w.phon}]</p>`:""}<button id="audio">🔊 Výslovnost</button>${w.phon?"<p><small>Orientační český přepis</small></p>":""}<div class="example"><b>${w.example[0]}</b><br><small>${w.example[1]}</small><p><button id="sentence">🔊 Poslechnout větu</button> <button id="fav">${isFav(w)?"★":"☆"} Oblíbené</button></p></div><div class="controls"><button id="prev" ${idx===0?'disabled':''}>←</button><button id="forward" ${idx===pool.length-1?'disabled':''}>→</button></div></article><article><h2>Procvičit dnešní slova</h2>${buttons(pool)}<p><button id="walk">🎧 Režim na procházku</button></p><label>Pauza <select id="pause"><option value="2">2 s</option><option value="4" selected>4 s</option><option value="6">6 s</option></select></label><p id="walkstatus"></p></article>`;$('walk').onclick=()=>walk(pool);$('audio').onclick=()=>speak(w);$('sentence').onclick=()=>speak({es:w.example[0]});$('fav').onclick=()=>{toggleFav(w);$('fav').textContent=(isFav(w)?'★':'☆')+' Oblíbené'};$('prev').onclick=()=>{stopWalk();idx--;render()};$('forward').onclick=()=>{stopWalk();idx++;render()};bindTests(pool)}else if(tab==='Pokrok'){let stats=Object.values(state.stats),total=stats.reduce((s,x)=>s+x.total,0),ok=stats.reduce((s,x)=>s+x.ok,0);v.innerHTML=`<article><h2>Tvůj pokrok</h2><p>Představená slovíčka: ${Math.min(position()+dose(),words.length)}</p><p>Procvičená slovíčka: ${stats.length}</p><p>Odpovědi: ${total}</p><p>Úspěšnost: ${total?Math.round(ok/total*100)+' %':'—'}</p></article><article><h2>Záloha a nastavení</h2><p><label>Rychlost výslovnosti <select id="rate"><option value="0.65">Pomalá</option><option value="0.85">Běžná</option><option value="1">Přirozená</option></select></label></p><p><label>Denní dávka <select id="dose">${doses.map(n=>`<option value="${n}">${n} slov</option>`).join('')}</select></label></p><p>Verze ${VERSION} · <button id="checkUpdate">Zkontrolovat aktualizace</button></p><p id="updateStatus" aria-live="polite"></p><p>Celkem ve slovníku: ${words.length}</p><p>Fotografie: ${words.filter(w=>w.photo).length} · <a href="PHOTO-CREDITS.txt">Zdroje a licence</a></p><div class="controls"><button id="export">Export zálohy</button><button id="import">Import zálohy</button><input type="file" id="backup" accept=".json" hidden></div><p><button id="sim">Simulovat další den</button> <button id="resetSim">Zrušit simulaci</button></p><small>Simulace: +${state.offset||0} dní. Testovací odpovědi se ukládají.</small></article>`;$('dose').value=String(dose());$('dose').onchange=e=>changeDose(+e.target.value);$('checkUpdate').onclick=checkUpdate;$('rate').value=String(state.rate||.85);$('rate').onchange=e=>{state.rate=+e.target.value;save()};$('export').onclick=exportBackup;$('import').onclick=()=>$('backup').click();$('backup').onchange=importBackup;$('sim').onclick=()=>{state.offset=(state.offset||0)+1;save();render()};$('resetSim').onclick=()=>{state.offset=0;save();render()}}else{renderLibrary(v)}}
let filters={q:'',topic:'',kind:'',level:''}, selected=new Set();
function isFav(w){return (state.favorites||[]).includes(w.id)}
function toggleFav(w){state.favorites=state.favorites||[];state.favorites=isFav(w)?state.favorites.filter(id=>id!==w.id):[...state.favorites,w.id];save()}
function fold(x){return x.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function renderLibrary(v){let base=tab==='Opakování'?archive():words;v.innerHTML=`<article><h2>${tab}</h2>${tab==='Opakování'?`<p><button id="due">Procvičit slova k opakování (${dueWords().length})</button></p>`:''}<input id="search" placeholder="Hledat česky nebo španělsky"><div class="controls filters"><select id="topic"><option value="">Všechna témata</option>${topics.map(t=>`<option>${t}</option>`).join('')}</select><select id="level" aria-label="Obtížnost"><option value="">Všechny obtížnosti</option><option value="1">1 – Základní</option><option value="2">2 – Střední</option><option value="3">3 – Pokročilá</option></select><select id="kind"><option value="">Všechna slova</option><option value="fav">Oblíbená</option><option value="bad">Problematická</option></select></div><p id="count"></p><div id="testcontrols"></div><p><button id="selectall">Vybrat zobrazená</button> <button id="clearselect">Zrušit výběr</button></p><p id="selection"></p><div id="rows"></div></article>`;
$('search').value=filters.q;$('topic').value=filters.topic;$('kind').value=filters.kind;$('level').value=filters.level;
function update(){let pool=base.filter(w=>(!filters.q||fold(w.es+' '+w.cz).includes(fold(filters.q)))&&(!filters.topic||w.topic===filters.topic)&&(!filters.level||w.level===Number(filters.level))&&(!filters.kind||(filters.kind==='fav'?isFav(w):((state.stats[w.id]?.total||0)>(state.stats[w.id]?.ok||0)))));let chosen=base.filter(w=>selected.has(w.id));$('count').textContent=pool.length+' slovíček';$('selection').textContent=chosen.length?'Test z vybraných: '+chosen.length:'Test ze zobrazených slov';$('testcontrols').innerHTML=(chosen.length||pool.length)?buttons(chosen.length?chosen:pool):'';bindTests(chosen.length?chosen:pool);$('rows').innerHTML=pool.map(w=>`<div class="word"><input type="checkbox" aria-label="Vybrat ${w.es}" data-select="${w.id}" ${selected.has(w.id)?'checked':''}><button class="word-open" data-open="${w.id}">${w.pic} <b>${w.es}</b><small>${w.cz} · ${w.topic} · ${["","Základní","Střední","Pokročilá"][w.level]}</small></button><div><button data-fav="${w.id}" aria-label="Oblíbené">${isFav(w)?'★':'☆'}</button> <button data-id="${w.id}">🔊</button></div></div>`).join('');document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openDetail(words[+b.dataset.open],update,b));document.querySelectorAll('[data-select]').forEach(b=>b.onchange=()=>{b.checked?selected.add(+b.dataset.select):selected.delete(+b.dataset.select);update()});document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>{toggleFav(words[+b.dataset.fav]);update()});document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>speak(words[+b.dataset.id]));$('selectall').onclick=()=>{pool.forEach(w=>selected.add(w.id));update()};$('clearselect').onclick=()=>{selected.clear();update()}}
$('search').oninput=e=>{filters.q=e.target.value;update()};$('topic').onchange=e=>{filters.topic=e.target.value;update()};$('level').onchange=e=>{filters.level=e.target.value;update()};$('kind').onchange=e=>{filters.kind=e.target.value;update()};if($('due'))$('due').onclick=()=>{let p=dueWords();if(p.length)start(p,'write');else alert('Dnes není potřeba nic opakovat.')};update()}
function openDetail(w,refresh,trigger){
 const d=$('detail'),scroll=window.scrollY;let changed=false;stopWalk();
 d.innerHTML=`<div class="detail-top"><small>Slovní karta</small><button id="detailClose" autofocus>✕ Zavřít</button></div><article class="center"><div class="picture">${wordPicture(w)}</div><h2 id="detailTitle">${w.es}</h2><div>${w.cz}</div><p>[${w.phon}]</p><small>Orientační český přepis</small><p><small>${w.topic} · ${["","Základní","Střední","Pokročilá"][w.level]}</small></p><div class="controls"><button id="detailAudio">🔊 Výslovnost</button><select id="detailRate" aria-label="Rychlost výslovnosti"><option value="0.65">Pomalá</option><option value="0.85">Běžná</option><option value="1">Přirozená</option></select></div><div class="example"><b>${w.example[0]}</b><br><small>${w.example[1]}</small><p><button id="detailSentence">🔊 Poslechnout větu</button></p></div><button id="detailFav">${isFav(w)?'★':'☆'} Oblíbené</button></article>`;
 $('detailRate').value=String(state.rate||.85);$('detailRate').onchange=e=>{state.rate=+e.target.value;save()};$('detailAudio').onclick=()=>speak(w);$('detailSentence').onclick=()=>speak({es:w.example[0]});$('detailFav').onclick=()=>{toggleFav(w);changed=true;$('detailFav').textContent=(isFav(w)?'★':'☆')+' Oblíbené'};$('detailClose').onclick=()=>d.close();
 d.onclose=()=>{stopWalk();document.body.classList.remove('detail-open');if(changed)refresh();let target=document.querySelector(`[data-open="${w.id}"]`)||$('search');target?.focus({preventScroll:true});window.scrollTo(0,scroll);d.innerHTML=''};d.showModal();document.body.classList.add('detail-open');d.scrollTop=0;
}
function dueWords(){return archive().filter(w=>!state.stats[w.id]?.due||state.stats[w.id].due<=day()+(state.offset||0))}
let walking=false,walkToken=0;function stopWalk(){walking=false;walkToken++;if('speechSynthesis'in window)speechSynthesis.cancel()}
function walk(pool){if(walking){stopWalk();$('walk').textContent='🎧 Režim na procházku';$('walkstatus').textContent='Zastaveno';return}if(!('speechSynthesis'in window))return alert('Výslovnost není dostupná.');walking=true;let token=++walkToken,pause=+$('pause').value*1000; $('walk').textContent='■ Zastavit';let i=0,j=0;function step(){if(!walking||token!==walkToken)return;let w=pool[i],lang=j===1?'cs-CZ':'es-ES',u=new SpeechSynthesisUtterance(j===1?w.cz:w.es);u.lang=lang;let voice=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase()===lang.toLowerCase());if(voice)u.voice=voice;u.rate=Number(state.rate)||.85;$('walkstatus').textContent=`${i+1}/${pool.length} · ${w.es}`;u.onend=()=>{if(++j===3){j=0;i=(i+1)%pool.length}setTimeout(step,pause)};u.onerror=()=>{if(token===walkToken){stopWalk();if($('walk'))$('walk').textContent='🎧 Režim na procházku';if($('walkstatus'))$('walkstatus').textContent='Přehrávání přerušeno.'}};speechSynthesis.speak(u)}step()}
function exportBackup(){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(state)],{type:'application/json'}));a.href=url;a.download='camino-zaloha.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function importBackup(e){try{let x=JSON.parse(await e.target.files[0].text());if(!Number.isInteger(x.start)||!x.stats||typeof x.stats!=='object'||Array.isArray(x.stats)||Object.entries(x.stats).some(([k,v])=>!/^\d+$/.test(k)||!v||!Number.isFinite(v.ok)||!Number.isFinite(v.total)||v.ok<0||v.total<v.ok))throw Error();if(!confirm('Nahradit současný pokrok zálohou?'))return;state={start:x.start,stats:x.stats,dark:!!x.dark,rate:[.65,.85,1].includes(x.rate)?x.rate:.85,favorites:Array.isArray(x.favorites)?x.favorites.filter(i=>Number.isInteger(i)&&i>=0&&i<words.length):[],offset:Number.isInteger(x.offset)?Math.max(0,x.offset):0,dose:doses.includes(x.dose)?x.dose:10,schedule:x.schedule&&Number.isInteger(x.schedule.day)&&Number.isInteger(x.schedule.pos)&&x.schedule.pos>=0?x.schedule:undefined};save();theme();render()}catch{alert('Neplatná záloha.')}}
render();let last=day();setInterval(()=>{if(day()!==last){last=day();if(!test){if($('detail').open)$('detail').close();stopWalk();idx=0;render()}}},30000);
async function checkUpdate(){let status=$('updateStatus');try{if(!('serviceWorker' in navigator))throw Error('Aktualizace je dostupná pouze v online aplikaci.');let r=await navigator.serviceWorker.getRegistration();if(!r)throw Error('Offline služba není registrována.');await r.update();if(status)status.textContent=$('updateBanner').hidden?'Kontrola dokončena. Pokud se najde nová verze, zobrazí se upozornění.':'Nová verze je připravena.'}catch(e){if(status)status.textContent='Kontrola se nezdařila. Zkontroluj připojení.'}}
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){let hadController=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadController)$('updateBanner').hidden=false;hadController=true});$('reloadUpdate').onclick=()=>location.reload();navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).catch(console.error);}
</script></body></html>
