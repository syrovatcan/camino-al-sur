function renderLibrary(v){let base=tab==='Opakování'?archive():words;v.innerHTML=`<article><h2>${tab}</h2>${tab==='Opakování'?`<p><button id="due">Procvičit slova k opakování (${dueWords().length})</button></p>`:''}<input id="search" placeholder="Hledat česky nebo španělsky"><div class="controls filters"><select id="topic"><option value="">Všechna témata</option>${topics.map(t=>`<option>${t}</option>`).join('')}</select><select id="kind"><option value="">Všechna slova</option><option value="fav">Oblíbená</option><option value="bad">Problematická</option></select></div><p id="count"></p><div id="testcontrols"></div><p><button id="selectall">Vybrat zobrazená</button> <button id="clearselect">Zrušit výběr</button></p><p id="selection"></p><div id="rows"></div></article>`;

function update(){let pool=base.filter(w=>(!filters.q||fold(w.es+' '+w.cz).includes(fold(filters.q)))&&(!filters.topic||w.topic===filters.topic)&&(!filters.kind||(filters.kind==='fav'?isFav(w):((state.stats[w.id]?.total||0)>(state.stats[w.id]?.ok||0)))));let chosen=base.filter(w=>selected.has(w.id));$('count').textContent=pool.length+' slovíček';$('selection').textContent=chosen.length?'Test z vybraných: '+chosen.length:'Test ze zobrazených slov';$('testcontrols').innerHTML=(chosen.length||pool.length)?buttons(chosen.length?chosen:pool):'';bindTests(chosen.length?chosen:pool);$('rows').innerHTML=pool.map(w=>`<div class="word"><label><input type="checkbox" data-select="${w.id}" ${selected.has(w.id)?'checked':''}> ${w.pic} <b>${w.es}</b><br><small>${w.cz} · ${w.topic}</small></label><div><button data-fav="${w.id}" aria-label="Oblíbené">${isFav(w)?'★':'☆'}</button> <button data-id="${w.id}">🔊</button></div></div>`).join('');document.querySelectorAll('[data-select]').forEach(b=>b.onchange=()=>{b.checked?selected.add(+b.dataset.select):selected.delete(+b.dataset.select);update()});document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>{toggleFav(words[+b.dataset.fav]);update()});document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>speak(words[+b.dataset.id]));$('selectall').onclick=()=>{pool.forEach(w=>selected.add(w.id));update()};$('clearselect').onclick=()=>{selected.clear();update()}}
$('search').oninput=e=>{filters.q=e.target.value;update()};$('topic').onchange=e=>{filters.topic=e.target.value;update()};$('kind').onchange=e=>{filters.kind=e.target.value;update()};if($('due'))$('due').onclick=()=>{let p=dueWords();if(p.length)start(p,'write');else alert('Dnes není potřeba nic opakovat.')};update()}
function dueWords(){return archive().filter(w=>!state.stats[w.id]?.due||state.stats[w.id].due<=day()+(state.offset||0))}
let walking=false,walkToken=0;function stopWalk(){walking=false;walkToken++;if('speechSynthesis'in window)speechSynthesis.cancel()}
function walk(pool){if(walking){stopWalk();$('walk').textContent='🎧 Režim na procházku';$('walkstatus').textContent='Zastaveno';return}if(!('speechSynthesis'in window))return alert('Výslovnost není dostupná.');walking=true;let token=++walkToken,pause=+$('pause').value*1000; $('walk').textContent='■ Zastavit';let i=0,j=0;function step(){if(!walking||token!==walkToken)return;let w=pool[i],lang=j===1?'cs-CZ':'es-ES',u=new SpeechSynthesisUtterance(j===1?w.cz:w.es);u.lang=lang;let voice=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase()===lang.toLowerCase());if(voice)u.voice=voice;u.rate=Number(state.rate)||.85;$('walkstatus').textContent=`${i+1}/${pool.length} · ${w.es}`;u.onend=()=>{if(++j===3){j=0;i=(i+1)%pool.length}setTimeout(step,pause)};u.onerror=()=>{if(token===walkToken){stopWalk();if($('walk'))$('walk').textContent='🎧 Režim na procházku';if($('walkstatus'))$('walkstatus').textContent='Přehrávání přerušeno.'}};speechSynthesis.speak(u)}step()}
function exportBackup(){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(state)],{type:'application/json'}));a.href=url;a.download='camino-zaloha.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function importBackup(e){try{let x=JSON.parse(await e.target.files[0].text());if(!Number.isInteger(x.start)||!x.stats||typeof x.stats!=='object'||Array.isArray(x.stats)||Object.entries(x.stats).some(([k,v])=>!/^\d+$/.test(k)||!v||!Number.isFinite(v.ok)||!Number.isFinite(v.total)||v.ok<0||v.total<v.ok))throw Error();if(!confirm('Nahradit současný pokrok zálohou?'))return;state={start:x.start,stats:x.stats,dark:!!x.dark,rate:[.65,.85,1].includes(x.rate)?x.rate:.85,favorites:Array.isArray(x.favorites)?x.favorites.filter(i=>Number.isInteger(i)&&i>=0&&i<words.length):[],offset:Number.isInteger(x.offset)?Math.max(0,x.offset):0};save();theme();render()}catch{alert('Neplatná záloha.')}}
render();let last=day();setInterval(()=>{if(day()!==last){last=day();if(!test){idx=0;render()}}},30000);
</script><script>if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) { navigator.serviceWorker.register('./sw.js').catch(console.error); }</script></body></html>
